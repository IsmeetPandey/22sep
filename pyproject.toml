[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextfossil"
version = "0.1.0"
description = "Capture and diff the ambient workspace context visible to coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ismeet Pandey"}]

[project.scripts]
contextfossil = "contextfossil.__main__:main"

[tool.setuptools.packages.find]
include = ["contextfossil*"]
