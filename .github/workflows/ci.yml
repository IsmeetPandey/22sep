name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q contextfossil
      - run: python -m contextfossil snapshot . --output /tmp/context.json
      - run: python -m contextfossil diff /tmp/context.json /tmp/context.json --json
      - run: python -m pip install --disable-pip-version-check --no-deps .
      - run: contextfossil snapshot . --output /tmp/installed.json
